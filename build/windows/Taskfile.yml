version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    desc: 编译 Windows 静态可执行文件（默认跟随当前架构）
    cmds:
      - task: common:build:bin
        vars:
          TARGET_OS: windows
          TARGET_ARCH: '{{.ARCH | default ARCH}}'
          OUTPUT: '{{.OUTPUT}}'

  build:amd64:
    desc: 编译 Windows x86_64 (amd64) 独立可执行文件
    cmds:
      - task: common:build:bin
        vars:
          TARGET_OS: windows
          TARGET_ARCH: amd64
          STANDALONE: 'true'
          OUTPUT: '{{.OUTPUT}}'

  build:arm64:
    desc: 编译 Windows ARM64 独立可执行文件
    cmds:
      - task: common:build:bin
        vars:
          TARGET_OS: windows
          TARGET_ARCH: arm64
          STANDALONE: 'true'
          OUTPUT: '{{.OUTPUT}}'

  package:
    desc: 打包 Windows .zip 发布归档（默认跟随当前架构）
    cmds:
      - task: common:archive
        vars:
          TARGET_OS: windows
          TARGET_ARCH: '{{.ARCH | default ARCH}}'

  package:amd64:
    desc: 打包 Windows x86_64 (amd64) .zip 发布归档
    cmds:
      - task: common:archive
        vars:
          TARGET_OS: windows
          TARGET_ARCH: amd64

  package:arm64:
    desc: 打包 Windows ARM64 .zip 发布归档
    cmds:
      - task: common:archive
        vars:
          TARGET_OS: windows
          TARGET_ARCH: arm64
