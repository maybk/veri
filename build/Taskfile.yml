version: '3'

vars:
  BIN_DIR: '{{.BIN_DIR | default "bin"}}'
  DIST_DIR: '{{.DIST_DIR | default "dist"}}'
  DEFAULT_APP_NAME:
    sh: |
      cr="$(printf '\r')"
      tab="$(printf '\t')"
      in_info=0
      while IFS= read -r line || [ -n "$line" ]; do
        line="${line%"$cr"}"
        case "$line" in
          info:|info:" "*|info:"$tab"*|info:"#"*) in_info=1 ;;
          " "*|"$tab"*)
            if [ "$in_info" -eq 1 ]; then
              trimmed="${line#"${line%%[!" $tab"]*}"}"
              case "$trimmed" in
                productName:*'"'*'"'*)
                  val="${trimmed#*\"}"
                  printf '%s' "${val%%\"*}"
                  exit 0
                  ;;
              esac
            fi
            ;;
          ""|"#"*) ;;
          *) in_info=0 ;;
        esac
      done < "{{.ROOT_DIR}}/build/config.yml"
      echo "failed to extract info.productName from build/config.yml" >&2
      exit 1
  APP_NAME: '{{.APP_NAME | default .DEFAULT_APP_NAME}}'
  DEFAULT_VERSION:
    sh: |
      cr="$(printf '\r')"
      tab="$(printf '\t')"
      in_info=0
      while IFS= read -r line || [ -n "$line" ]; do
        line="${line%"$cr"}"
        case "$line" in
          info:|info:" "*|info:"$tab"*|info:"#"*) in_info=1 ;;
          " "*|"$tab"*)
            if [ "$in_info" -eq 1 ]; then
              trimmed="${line#"${line%%[!" $tab"]*}"}"
              case "$trimmed" in
                version:*'"'*'"'*)
                  val="${trimmed#*\"}"
                  printf '%s' "${val%%\"*}"
                  exit 0
                  ;;
              esac
            fi
            ;;
          ""|"#"*) ;;
          *) in_info=0 ;;
        esac
      done < "{{.ROOT_DIR}}/build/config.yml"
      echo "failed to extract info.version from build/config.yml" >&2
      exit 1
  VERSION: '{{.VERSION | default .DEFAULT_VERSION}}'
  DEFAULT_COMMIT:
    sh: git -C "{{.ROOT_DIR}}" rev-parse --short=12 HEAD 2>/dev/null || printf 'none'
  COMMIT: '{{.COMMIT | default .DEFAULT_COMMIT}}'
  BUILD_DATE: '{{.BUILD_DATE | default (now.UTC.Format "2006-01-02T15:04:05Z")}}'

tasks:
  build:bin:
    internal: true
    dir: '{{.ROOT_DIR}}'
    label: "build:bin ({{.TARGET_OS}}/{{.TARGET_ARCH}})"
    vars:
      TARGET_OS: '{{.TARGET_OS | default OS}}'
      TARGET_ARCH: '{{.TARGET_ARCH | default ARCH}}'
      EXT: '{{if eq .TARGET_OS "windows"}}.exe{{end}}'
      AUTO_OUTPUT: '{{if and (ne .STANDALONE "true") (eq .TARGET_OS OS) (eq .TARGET_ARCH ARCH)}}{{.BIN_DIR}}/{{.APP_NAME}}{{.EXT}}{{else}}{{.BIN_DIR}}/{{.APP_NAME}}-{{.TARGET_OS}}-{{.TARGET_ARCH}}{{.EXT}}{{end}}'
      RESOLVED_OUTPUT: '{{.OUTPUT | default .AUTO_OUTPUT}}'
    cmds:
      - >-
        GOOS="{{.TARGET_OS}}" GOARCH="{{.TARGET_ARCH}}" CGO_ENABLED=0 go build -trimpath
        -ldflags "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildDate={{.BUILD_DATE}}"
        -o "{{.RESOLVED_OUTPUT}}" .

  archive:
    internal: true
    dir: '{{.ROOT_DIR}}'
    label: "archive ({{.TARGET_OS}}/{{.TARGET_ARCH}})"
    vars:
      TARGET_OS: '{{.TARGET_OS | default OS}}'
      TARGET_ARCH: '{{.TARGET_ARCH | default ARCH}}'
    cmds:
      - task: '{{if eq .TARGET_OS "windows"}}archive:windows{{else}}archive:unix{{end}}'
        vars:
          TARGET_OS: '{{.TARGET_OS}}'
          TARGET_ARCH: '{{.TARGET_ARCH}}'
          APP_NAME: '{{.APP_NAME}}'
          VERSION: '{{.VERSION}}'
          COMMIT: '{{.COMMIT}}'
          BUILD_DATE: '{{.BUILD_DATE}}'
          DIST_DIR: '{{.DIST_DIR}}'

  archive:unix:
    internal: true
    silent: true
    dir: '{{.ROOT_DIR}}'
    label: "archive:unix ({{.TARGET_OS}}/{{.TARGET_ARCH}})"
    cmds:
      - cmd: |
          set -euo pipefail
          mkdir -p "{{.DIST_DIR}}"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          GOOS="{{.TARGET_OS}}" GOARCH="{{.TARGET_ARCH}}" CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildDate={{.BUILD_DATE}}" \
            -o "$stage/{{.APP_NAME}}" .
          items=("{{.APP_NAME}}")
          for doc in LICENSE THIRD_PARTY_NOTICES.md README.md README.en.md; do
            if [ -f "$doc" ]; then
              cp "$doc" "$stage/"
              items+=("$doc")
            fi
          done
          if [ -f "skills/{{.APP_NAME}}/SKILL.md" ]; then
            mkdir -p "$stage/skills/{{.APP_NAME}}"
            cp "skills/{{.APP_NAME}}/SKILL.md" "$stage/skills/{{.APP_NAME}}/SKILL.md"
            items+=("skills")
          fi
          out="{{.DIST_DIR}}/{{.APP_NAME}}-{{.VERSION}}-{{.TARGET_OS}}-{{.TARGET_ARCH}}.tar.gz"
          case "$out" in
            /*) out_abs="$out" ;;
            *) out_abs="{{.ROOT_DIR}}/$out" ;;
          esac
          if tar --version 2>/dev/null | grep -qi 'GNU tar'; then
            (cd "$stage" && tar --owner=0 --group=0 --numeric-owner -czf "$out_abs" "${items[@]}")
          else
            (cd "$stage" && COPYFILE_DISABLE=1 tar --uid 0 --gid 0 --uname "" --gname "" -czf "$out_abs" "${items[@]}")
          fi
          printf 'packaged %s\n' "$out"
        platforms: [darwin, linux]
      - cmd: |
          powershell -NoProfile -Command '
            $ErrorActionPreference = "Stop";
            $distDir = if ([System.IO.Path]::IsPathRooted("{{.DIST_DIR}}")) { "{{.DIST_DIR}}" } else { Join-Path "{{.ROOT_DIR}}" "{{.DIST_DIR}}" };
            New-Item -ItemType Directory -Path $distDir -Force | Out-Null;
            $stage = Join-Path ([System.IO.Path]::GetTempPath()) ("{{.APP_NAME}}-stage-" + [guid]::NewGuid().ToString("N"));
            New-Item -ItemType Directory -Path $stage -Force | Out-Null;
            try {
              $env:GOOS = "{{.TARGET_OS}}"; $env:GOARCH = "{{.TARGET_ARCH}}"; $env:CGO_ENABLED = "0";
              go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildDate={{.BUILD_DATE}}" -o (Join-Path $stage "{{.APP_NAME}}") .;
              if ($LASTEXITCODE -ne 0) { throw "go build failed with exit code $LASTEXITCODE" };
              $items = @("{{.APP_NAME}}");
              foreach ($f in @("LICENSE","THIRD_PARTY_NOTICES.md","README.md","README.en.md")) {
                if (Test-Path -LiteralPath $f) {
                  Copy-Item -LiteralPath $f -Destination (Join-Path $stage $f) -Force;
                  $items += $f;
                }
              };
              if (Test-Path -LiteralPath "skills/{{.APP_NAME}}/SKILL.md") {
                New-Item -ItemType Directory -Path (Join-Path $stage "skills/{{.APP_NAME}}") -Force | Out-Null;
                Copy-Item -LiteralPath "skills/{{.APP_NAME}}/SKILL.md" -Destination (Join-Path $stage "skills/{{.APP_NAME}}/SKILL.md") -Force;
                $items += "skills";
              };
              $name = "{{.APP_NAME}}-{{.VERSION}}-{{.TARGET_OS}}-{{.TARGET_ARCH}}.tar.gz";
              $archive = Join-Path $distDir $name;
              $tarVer = (tar --version 2>$null | Out-String);
              if ($tarVer -match "GNU tar") {
                tar --owner=0 --group=0 --numeric-owner -czf $archive -C $stage @items;
              } else {
                tar --uid 0 --gid 0 --uname "" --gname "" -czf $archive -C $stage @items;
              };
              if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" };
              Write-Host "packaged {{.DIST_DIR}}/$name";
            } finally {
              Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue;
            }
          '
        platforms: [windows]

  archive:windows:
    internal: true
    silent: true
    dir: '{{.ROOT_DIR}}'
    label: "archive:windows (windows/{{.TARGET_ARCH}})"
    cmds:
      - cmd: |
          set -euo pipefail
          mkdir -p "{{.DIST_DIR}}"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          GOOS=windows GOARCH="{{.TARGET_ARCH}}" CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildDate={{.BUILD_DATE}}" \
            -o "$stage/{{.APP_NAME}}.exe" .
          items=("{{.APP_NAME}}.exe")
          for doc in LICENSE THIRD_PARTY_NOTICES.md README.md README.en.md; do
            if [ -f "$doc" ]; then
              cp "$doc" "$stage/"
              items+=("$doc")
            fi
          done
          if [ -f "skills/{{.APP_NAME}}/SKILL.md" ]; then
            mkdir -p "$stage/skills/{{.APP_NAME}}"
            cp "skills/{{.APP_NAME}}/SKILL.md" "$stage/skills/{{.APP_NAME}}/SKILL.md"
            items+=("skills")
          fi
          out="{{.DIST_DIR}}/{{.APP_NAME}}-{{.VERSION}}-windows-{{.TARGET_ARCH}}.zip"
          case "$out" in
            /*) out_abs="$out" ;;
            *) out_abs="{{.ROOT_DIR}}/$out" ;;
          esac
          if command -v zip >/dev/null 2>&1; then
            (cd "$stage" && zip -qr "$out_abs" "${items[@]}")
          elif command -v python3 >/dev/null 2>&1; then
            (cd "$stage" && python3 -m zipfile -c "$out_abs" "${items[@]}")
          else
            echo "missing 'zip' (or python3) required to package Windows .zip archive" >&2
            exit 1
          fi
          printf 'packaged %s\n' "$out"
        platforms: [darwin, linux]
      - cmd: |
          powershell -NoProfile -Command '
            $ErrorActionPreference = "Stop";
            $distDir = if ([System.IO.Path]::IsPathRooted("{{.DIST_DIR}}")) { "{{.DIST_DIR}}" } else { Join-Path "{{.ROOT_DIR}}" "{{.DIST_DIR}}" };
            New-Item -ItemType Directory -Path $distDir -Force | Out-Null;
            $stage = Join-Path ([System.IO.Path]::GetTempPath()) ("{{.APP_NAME}}-stage-" + [guid]::NewGuid().ToString("N"));
            New-Item -ItemType Directory -Path $stage -Force | Out-Null;
            try {
              $env:GOOS = "windows"; $env:GOARCH = "{{.TARGET_ARCH}}"; $env:CGO_ENABLED = "0";
              go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildDate={{.BUILD_DATE}}" -o (Join-Path $stage "{{.APP_NAME}}.exe") .;
              if ($LASTEXITCODE -ne 0) { throw "go build failed with exit code $LASTEXITCODE" };
              foreach ($f in @("LICENSE","THIRD_PARTY_NOTICES.md","README.md","README.en.md")) {
                if (Test-Path -LiteralPath $f) { Copy-Item -LiteralPath $f -Destination (Join-Path $stage $f) -Force }
              };
              if (Test-Path -LiteralPath "skills/{{.APP_NAME}}/SKILL.md") {
                New-Item -ItemType Directory -Path (Join-Path $stage "skills/{{.APP_NAME}}") -Force | Out-Null;
                Copy-Item -LiteralPath "skills/{{.APP_NAME}}/SKILL.md" -Destination (Join-Path $stage "skills/{{.APP_NAME}}/SKILL.md") -Force;
              };
              $name = "{{.APP_NAME}}-{{.VERSION}}-windows-{{.TARGET_ARCH}}.zip";
              $out = Join-Path $distDir $name;
              Compress-Archive -Path "$stage/*" -DestinationPath $out -Force;
              Write-Host "packaged {{.DIST_DIR}}/$name";
            } finally {
              Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue;
            }
          '
        platforms: [windows]

  checksums:
    internal: true
    silent: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{.DIST_DIR}}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum {{.APP_NAME}}-* > SHA256SUMS.txt
          else
            shasum -a 256 {{.APP_NAME}}-* > SHA256SUMS.txt
          fi
          printf 'generated %s/SHA256SUMS.txt\n' "{{.DIST_DIR}}"
        platforms: [darwin, linux]
      - cmd: |
          powershell -NoProfile -Command '
            $ErrorActionPreference = "Stop";
            Set-Location "{{.DIST_DIR}}";
            $files = @(Get-ChildItem -File -Filter "{{.APP_NAME}}-*" | Sort-Object Name);
            if ($files.Count -eq 0) { throw "no release archives found in {{.DIST_DIR}}" };
            $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name };
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false);
            [System.IO.File]::WriteAllText((Join-Path (Get-Location).Path "SHA256SUMS.txt"), (($lines -join "`n") + "`n"), $utf8NoBom);
            Write-Host "generated {{.DIST_DIR}}/SHA256SUMS.txt";
          '
        platforms: [windows]
