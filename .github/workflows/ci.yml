name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: Optional commit SHA to check out when called from another workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, Lint, Vuln Scan & Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting and static analysis
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:" >&2
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi
          for goos in linux darwin windows; do
            GOOS="$goos" GOARCH=amd64 go vet ./...
          done

      - name: Verify live test build tag and cross-platform compilation
        shell: bash
        run: |
          set -euo pipefail
          go test -tags live -c -o /dev/null ./internal/provider/providertest
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            out="$RUNNER_TEMP/veri-${goos}-${goarch}${ext}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -o "$out" .
            test -s "$out"
          done

      - name: Run build and release contract tests
        run: |
          bash scripts/test_extract_pending_version.sh
          bash scripts/test_extract_release_notes.sh
          bash scripts/test_prepare_release.sh
          bash scripts/test_install_scripts.sh
          bash scripts/test_ci_config.sh
          bash scripts/test_rolling_release_config.sh
          git diff --check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  test:
    name: Test & Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with race detector (Unix)
        if: matrix.os != 'windows-latest'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Run tests (Windows CGO_ENABLED=0)
        if: matrix.os == 'windows-latest'
        run: go test ./...

      - name: Build static binary and run cross-platform smoke checks
        shell: bash
        run: |
          set -euo pipefail
          ext="$(go env GOEXE)"
          bin_path="bin/veri${ext}"
          go build -trimpath -o "$bin_path" .
          "./$bin_path" version
          "./$bin_path" providers --json >/dev/null
          "./$bin_path" --help >/dev/null
          if [ -d skills ]; then
            "./$bin_path" skill print >/dev/null
          fi

      - name: Validate Windows installer script syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('scripts/install.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  artifact-upload:
    name: Upload CI artifact payload
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create artifact payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifact-source"
          printf '%s\n' 'veri-ci-artifact-roundtrip' > "$RUNNER_TEMP/artifact-source/payload.txt"

      - name: Upload artifact payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-artifact-roundtrip
          path: ${{ runner.temp }}/artifact-source/payload.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  artifact-roundtrip:
    name: Verify artifact upload and download
    needs: artifact-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download artifact payload
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-artifact-roundtrip
          path: ${{ runner.temp }}/artifact-download

      - name: Wait before retrying artifact download
        if: steps.download.outcome != 'success'
        shell: bash
        run: sleep 5

      - name: Retry artifact download
        if: steps.download.outcome != 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-artifact-roundtrip
          path: ${{ runner.temp }}/artifact-download

      - name: Verify artifact payload
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'veri-ci-artifact-roundtrip' > "$RUNNER_TEMP/expected.txt"
          cmp --silent "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/artifact-download/payload.txt"
