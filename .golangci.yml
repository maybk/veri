version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - modernize
    - noctx
    - revive
    - staticcheck
    - unused
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: exported
          disabled: false
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
      - path: ^internal/spec/registry\.go$
        linters:
          - gosec
        text: "G101:"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
