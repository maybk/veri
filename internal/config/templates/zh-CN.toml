# veri 配置文件。所有键均可省略，省略时使用内置默认值。
# 密钥推荐使用 "veri key set <provider>" 加密保存，或使用 "env:变量名" 引用环境变量。

[ui]
lang = "auto"                           # auto | zh | en

[search]
providers = ["deepseek", "exa", "zhihu", "tinyfish", "tencent_wsa", "tavily", "brave", "linkup", "keenable", "firecrawl"]
# providers_en = ["exa", "linkup", "tavily", "brave", "tinyfish", "keenable", "deepseek"]
# fusion_providers = ["deepseek", "exa", "tavily"]
strategy = "auto"                       # auto | fusion
count = 8                               # 默认结果数（1～50）
detail = "summary"                      # snippet | summary | content
timeout = "20s"                         # 整次检索超时
fallback_on_empty = true                # 空结果时自动尝试下一个检索源
strict_filters = false                  # true 时禁止本地模拟过滤
fusion_k = 60                           # RRF 融合常数
summary_max_runes = 800

[fetch]
strategy = "api_first"                  # api_first | smart_local | local_only | api_only
providers = ["deepseek", "tinyfish", "tavily", "exa", "linkup", "keenable", "firecrawl"]
providers_global = ["exa", "tavily", "linkup", "tinyfish", "keenable", "firecrawl", "deepseek"] # 非中文站点提取链（设 [] 关闭分链）
timeout = "45s"
max_bytes = "5MB"                       # 本地抓取解压后响应体上限
min_content_runes = 300                 # 本地提取正文质量闸门最少字符数
respect_robots = false
user_agent = "browser"                  # browser | veri | 自定义字符串

[mcp]
text_format = "markdown"                # markdown | json
search_max_chars = 24000
fetch_max_chars = 30000
max_count = 20
cache_ttl = "5m"                        # 设为 "0s" 可禁用 MCP 进程内缓存
cache_size = 256

[network]
proxy = ""                              # 为空时遵循 HTTPS_PROXY / HTTP_PROXY / NO_PROXY
fake_ip_cidrs = ["198.18.0.0/15"]       # TUN 模式 Fake-IP 网段
allow_private = false                   # 本地抓取是否允许内网地址（默认关闭以防御 SSRF）

[providers.deepseek]
api_key = "env:DEEPSEEK_API_KEY"        # 支持直接填写明文密钥，多个 Key 用逗号分隔
base_url = "https://api.deepseek.com"
timeout = "10s"
fetch_timeout = "10s"
concurrency = 4
weight = 1.0
# price_search = "CNY:0.005"            # 可选：配置参考单价以在响应中估算成本
# price_fetch = "CNY:0.005"

[providers.keenable]
api_key = "env:KEENABLE_API_KEY"        # 默认数据策略会留存查询与结果，敏感查询可设 enabled = false
mode = "pro"                            # pro | realtime

[providers.zhihu]
api_key = "env:ZHIHU_API_KEY"           # 兼容 ZHIHU_ACCESS_SECRET
scope = "global"                        # global（全网）| zhihu（知乎站内）
search_db = "all"                       # all | realtime | static（仅 global 生效）
# price_search = "CNY:0.005"
# price_zhihu_search = "CNY:0.02"

[providers.exa]
api_key = "env:EXA_API_KEY"
search_type = "auto"                    # lite | auto | fast | instant | deep-lite | deep | deep-reasoning
allow_over_10 = false

[providers.tinyfish]
api_key = "env:TINYFISH_API_KEY"
search_url = "https://api.search.tinyfish.ai"
fetch_url = "https://api.fetch.tinyfish.ai"

[providers.tencent_wsa]
api_key = "env:TENCENT_WSA_API_KEY"
edition = "standard"                    # lite | standard | flagship
base_url = "https://api.wsa.cloud.tencent.com"
timeout = "10s"

[providers.tavily]
api_key = "env:TAVILY_API_KEY"
search_depth = "basic"                  # ultra-fast | fast | basic | advanced
extract_depth = "basic"                 # basic | advanced

[providers.brave]
api_key = "env:BRAVE_API_KEY"
mode = "auto"                           # auto | context | web

[providers.linkup]
api_key = "env:LINKUP_API_KEY"
depth = "fast"                          # flash | fast | standard | deep
fetch_mode = "standard"                 # standard | pro
render_js = false                       # 遇反爬/JS 盾时自动按需升档

[providers.firecrawl]
api_key = "env:FIRECRAWL_API_KEY"       # 官方云端必填；指向自托管 base_url 时允许无密钥（仅回环可用 http://，非回环需 https://）
# base_url = "https://api.firecrawl.dev"
proxy = "auto"                          # auto | basic | enhanced
max_pdf_pages = 20                      # PDF 最大解析页数上限
fetch_timeout = "45s"
concurrency = 2

[providers.github]
enabled = true
token = "env:GITHUB_TOKEN"              # 可选：配置 GitHub Token 提高接口配额

[providers.local]
enabled = true                          # 设为 false 可完全禁用本地网页提取器
timeout = "10s"
concurrency = 4
