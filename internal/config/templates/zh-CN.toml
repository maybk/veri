# veri 配置参考模板。默认全部注释，未取消注释的项随版本自动使用最新默认值。
# 密钥请用 `veri key set <provider>` 加密保存，或设置环境变量。
# 调整单个选项推荐执行 `veri config set <key> <value>`，或取消下方对应行注释。

# [ui]
# lang = "auto"                           # auto | zh | en

# [search]
# providers = ["deepseek", "keenable", "zhihu", "tencent_wsa", "zhihu_web", "brave", "parallel", "exa", "tavily", "linkup", "tinyfish", "firecrawl"]
# providers_global = ["keenable", "parallel", "exa", "brave", "linkup", "tavily", "deepseek", "tinyfish", "firecrawl", "tencent_wsa", "zhihu_web", "zhihu"] # 非中文检索链（设 [] 关闭）
# --fusion 并发池（留空取当前检索链前 3 个已启用源）
## fusion_providers = ["deepseek", "keenable", "zhihu"]
## fusion_providers_global = ["keenable", "parallel", "exa"]
# strategy = "auto"                       # auto | fusion
# count = 8                               # 默认结果数（1～50）
# detail = "summary"                      # snippet | summary | content
# timeout = "20s"                         # 整次检索超时
# fallback_on_empty = true                # 空结果时自动尝试下一个检索源
# strict_filters = false                  # true 时禁止本地模拟过滤
# fusion_k = 60                           # RRF 融合常数
# summary_max_chars = 800

# [fetch]
# strategy = "api_first"                  # api_first | smart_local | local_only | api_only
# providers = ["keenable", "tavily", "firecrawl", "parallel", "exa", "linkup", "deepseek", "tinyfish"]
# providers_global = ["keenable", "tavily", "parallel", "exa", "linkup", "firecrawl", "tinyfish", "deepseek"] # 非中文站点提取链（设 [] 关闭）
# timeout = "45s"                         # 整次提取超时
# max_bytes = "5MB"                       # 本地抓取解压后响应体上限
# min_content_chars = 300                 # 本地提取正文质量闸门最少字符数
# respect_robots = false
# user_agent = "browser"                  # browser | veri | 自定义字符串

# [cache]
# enabled = true                          # 缓存总开关（false 关闭 CLI 与 MCP 全部缓存）
# dir = ""                                # 磁盘缓存目录（留空使用 ~/.cache/veri）
# fetch_ttl = "15m"                       # 默认网页正文缓存有效期（CLI 与 MCP 共享）
# search_ttl = "0s"                       # 默认检索缓存有效期（CLI 默认不缓存）
# max_bytes = "32MB"                      # 磁盘缓存容量上限

# [cache.cli]
## enabled = true                         # 可选覆写：仅开关 CLI 磁盘缓存
## fetch_ttl = "15m"                      # 可选覆写："0s" 仅关闭 CLI 抓取缓存
## search_ttl = "0s"                      # 可选覆写：如设 "2m" 开启 CLI 检索缓存

# [cache.mcp]
## enabled = true                         # 可选覆写：仅开关 MCP 内存缓存
## fetch_ttl = "15m"                      # 可选覆写：未设时继承 cache.fetch_ttl
# search_ttl = "5m"                       # MCP 进程内检索缓存有效期
# max_entries = 256                       # MCP 内存缓存条目上限（0 关闭）

# [mcp]
# text_format = "markdown"                # markdown | json
# search_max_chars = 24000
# fetch_max_chars = 30000
# content_max_chars = 3000                # 单条结果正文上限
# max_count = 20

# [network]
# proxy = ""                              # 为空时遵循 HTTPS_PROXY / HTTP_PROXY / NO_PROXY
# fake_ip_cidrs = ["198.18.0.0/15"]       # TUN 模式 Fake-IP 网段
# allow_private = false                   # 本地抓取是否允许内网地址（默认关闭以防御 SSRF）

# 各 Provider 均支持 enabled = false，以及 timeout / concurrency / qps / weight。
# [providers.deepseek]
# api_key = "env:DEEPSEEK_API_KEY"        # 推荐使用 `veri key set deepseek` 或环境变量引用
# base_url = "https://api.deepseek.com"
# timeout = "10s"
# fetch_timeout = "10s"
# concurrency = 4
# weight = 1.0                            # 融合排序权重
## price_search = "CNY:0.005"             # 可选：配置参考单价以在响应中估算成本
## price_fetch = "CNY:0.005"

# [providers.keenable]
# api_key = "env:KEENABLE_API_KEY"        # 默认留存查询与结果，敏感场景可设 enabled = false
# mode = "pro"                            # pro | realtime

# [providers.zhihu]
# api_key = "env:ZHIHU_API_KEY"           # 知乎站内问答与专栏搜索（同时启用 zhihu 与 zhihu_web）
## price_search = "CNY:0.02"

# [providers.zhihu_web]
# enabled = true                          # 知乎全网搜索（自动共享 zhihu 密钥 / ZHIHU_API_KEY）
# search_db = "all"                       # all | realtime | static
## price_search = "CNY:0.005"

# [providers.exa]
# api_key = "env:EXA_API_KEY"
# search_type = "auto"                    # lite | auto | fast | instant | deep-lite | deep | deep-reasoning
# allow_over_10 = false                   # 允许单次超过 10 条（可能触发高价档）

# [providers.tinyfish]
# api_key = "env:TINYFISH_API_KEY"
# search_url = "https://api.search.tinyfish.ai"
# fetch_url = "https://api.fetch.tinyfish.ai"

# [providers.tencent_wsa]
# api_key = "env:TENCENT_WSA_API_KEY"
# edition = "standard"                    # lite | standard | flagship
# base_url = "https://api.wsa.cloud.tencent.com"
# timeout = "10s"

# [providers.tavily]
# api_key = "env:TAVILY_API_KEY"
# search_depth = "basic"                  # ultra-fast | fast | basic | advanced
# extract_depth = "basic"                 # basic | advanced

# [providers.brave]
# api_key = "env:BRAVE_API_KEY"
# mode = "auto"                           # auto | context | web

# [providers.linkup]
# api_key = "env:LINKUP_API_KEY"
# depth = "fast"                          # flash | fast | standard | deep
# fetch_mode = "standard"                 # standard | pro
# render_js = false                       # 遇反爬或 JS 拦截页时自动按需升档

# [providers.parallel]
# api_key = "env:PARALLEL_API_KEY"        # 标准条款允许去标识化训练；EU 端点需 mode = "basic"
# mode = "fast"                           # turbo | fast | basic | advanced
# base_url = "https://api.parallel.ai"
## price_search = "USD:0.001"
## price_fetch = "USD:0.001"

# [providers.firecrawl]
# api_key = "env:FIRECRAWL_API_KEY"       # 云端必填；自托管 base_url 可留空（远程需 https://）
# base_url = "https://api.firecrawl.dev"
# proxy = "auto"                          # auto | basic | enhanced
# max_pdf_pages = 20                      # PDF 最大解析页数上限
# fetch_timeout = "45s"
# concurrency = 2

# [providers.github]
# enabled = true
# token = "env:GITHUB_TOKEN"              # 可选：配置 GitHub Token 提高接口配额

# [providers.local]
# enabled = true                          # 设为 false 可完全禁用本地网页提取器
# timeout = "10s"
# concurrency = 4
