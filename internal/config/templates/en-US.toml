# veri configuration file. All fields are optional and fall back to built-in defaults.
# Store API keys securely via "veri key set <provider>", or reference env vars via "env:VAR_NAME".

[ui]
lang = "auto"                           # auto | zh | en

[search]
providers = ["deepseek", "exa", "zhihu", "tinyfish", "tencent_wsa", "tavily", "brave", "linkup", "parallel", "keenable", "firecrawl"]
# providers_en = ["exa", "parallel", "linkup", "tavily", "brave", "tinyfish", "keenable", "deepseek"]
# fusion_providers = ["deepseek", "exa", "tavily"]
strategy = "auto"                       # auto | fusion
count = 8                               # default result count (1-50)
detail = "summary"                      # snippet | summary | content
timeout = "20s"                         # overall search timeout
fallback_on_empty = true                # try next provider on empty results
strict_filters = false                  # true disables local filter emulation
fusion_k = 60                           # RRF constant
summary_max_runes = 800

[fetch]
strategy = "api_first"                  # api_first | smart_local | local_only | api_only
providers = ["deepseek", "tinyfish", "tavily", "exa", "linkup", "parallel", "keenable", "firecrawl"]
providers_global = ["exa", "tavily", "linkup", "parallel", "tinyfish", "keenable", "firecrawl", "deepseek"] # non-CN fetch chain (set [] to disable)
timeout = "45s"
max_bytes = "5MB"                       # max decompressed response size for local fetch
min_content_runes = 300                 # minimum runes required to pass local quality gate
respect_robots = false
user_agent = "browser"                  # browser | veri | custom string

[mcp]
text_format = "markdown"                # markdown | json
search_max_chars = 24000
fetch_max_chars = 30000
max_count = 20
cache_ttl = "5m"                        # set "0s" to disable in-process MCP cache
cache_size = 256

[network]
proxy = ""                              # empty respects HTTPS_PROXY / HTTP_PROXY / NO_PROXY
fake_ip_cidrs = ["198.18.0.0/15"]       # TUN Fake-IP CIDR allowlist
allow_private = false                   # allow private/loopback IPs in local fetch (keep false for SSRF guard)

[providers.deepseek]
api_key = "env:DEEPSEEK_API_KEY"        # supports plaintext keys (comma-separated for rotation)
base_url = "https://api.deepseek.com"
timeout = "10s"
fetch_timeout = "10s"
concurrency = 4
weight = 1.0
# price_search = "CNY:0.005"            # optional reference unit price for cost estimation
# price_fetch = "CNY:0.005"

[providers.keenable]
api_key = "env:KEENABLE_API_KEY"        # default data policy retains queries/results; set enabled = false for sensitive queries
mode = "pro"                            # pro | realtime

[providers.zhihu]
api_key = "env:ZHIHU_API_KEY"           # also accepts ZHIHU_ACCESS_SECRET
scope = "global"                        # global (web) | zhihu (Zhihu community)
search_db = "all"                       # all | realtime | static (global scope only)
# price_search = "CNY:0.005"
# price_zhihu_search = "CNY:0.02"

[providers.exa]
api_key = "env:EXA_API_KEY"
search_type = "auto"                    # lite | auto | fast | instant | deep-lite | deep | deep-reasoning
allow_over_10 = false

[providers.tinyfish]
api_key = "env:TINYFISH_API_KEY"
search_url = "https://api.search.tinyfish.ai"
fetch_url = "https://api.fetch.tinyfish.ai"

[providers.tencent_wsa]
api_key = "env:TENCENT_WSA_API_KEY"
edition = "standard"                    # lite | standard | flagship
base_url = "https://api.wsa.cloud.tencent.com"
timeout = "10s"

[providers.tavily]
api_key = "env:TAVILY_API_KEY"
search_depth = "basic"                  # ultra-fast | fast | basic | advanced
extract_depth = "basic"                 # basic | advanced

[providers.brave]
api_key = "env:BRAVE_API_KEY"
mode = "auto"                           # auto | context | web

[providers.linkup]
api_key = "env:LINKUP_API_KEY"
depth = "fast"                          # flash | fast | standard | deep
fetch_mode = "standard"                 # standard | pro
render_js = false                       # auto-escalates when an anti-bot/JS wall is detected

[providers.parallel]
api_key = "env:PARALLEL_API_KEY"        # standard terms allow de-identified training; EU ZDR endpoint (eu.parallel.ai) requires mode = "basic"
mode = "fast"                           # turbo | fast | basic | advanced
# base_url = "https://api.parallel.ai"
# price_search = "USD:0.001"            # optional unit price estimate
# price_fetch = "USD:0.001"             # optional Extract unit price estimate

[providers.firecrawl]
api_key = "env:FIRECRAWL_API_KEY"       # required for Firecrawl Cloud; optional for self-hosted base_url (http:// allowed for loopback only; remote hosts require https://)
# base_url = "https://api.firecrawl.dev"
proxy = "auto"                          # auto | basic | enhanced
max_pdf_pages = 20                      # max PDF pages parsed per fetch
fetch_timeout = "45s"
concurrency = 2

[providers.github]
enabled = true
token = "env:GITHUB_TOKEN"              # optional token for higher GitHub API rate limits

[providers.local]
enabled = true                          # set false to completely disable the local extractor
timeout = "10s"
concurrency = 4
